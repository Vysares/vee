[package]
name = "vee-sample-deployment"
edition.workspace = true
version.workspace = true

[dependencies]
vee-core = { path = "../core" }
vee-core-api = { path = "../core-api" }
vee-core-types = { path = "../core-types" }
vee-osal = { path = "../osal" }
vee-example = { path = "../modules/example" }
vee-watcher = { path = "../modules/watcher" }
log = { workspace = true }

# `alloc-guard` makes any allocation after startup abort the process, with a fixed message. It is a
# check for development, SIL and CI builds (`cargo test --features alloc-guard`), and a flight build
# leaves it off: an allocation that works is a bug to find before flight, and aborting on it in
# flight would turn that bug into an outage. See `std_alloc_guard`.
[features]
alloc-guard = []

[lints]
workspace = true
