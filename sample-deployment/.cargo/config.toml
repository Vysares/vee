# Build-time settings for this deployment. Run cargo from this directory (or pass
# `--config sample-deployment/.cargo/config.toml`) and these override Vee's defaults.
#
# Every setting is optional: leave a line out to use the default. Each setting is declared next to
# the code that uses it, with its default and allowed range (search for `setting!`). A real
# environment variable of the same name wins over this file. Everything in a deployment, including
# the ground tool, must be built with the same values.

[env]
# How many bytes of text an event carries. Sets the event log record size. Default 64, 1..=4096.
VEE_EV_TEXT_MAX_BYTES = "64"

# How many records the reset log holds before it is rotated at startup. Default 1024, 1..=1000000.
VEE_RESET_LOG_MAX_RECORDS = "1024"

# How many records the event log holds before it is rotated at startup. Default 10000, 1..=1000000.
VEE_EVENT_LOG_MAX_RECORDS = "10000"

# How many times each event can be sent in one tick before extra sends are suppressed.
# Default 5, 1..=255.
VEE_EV_MAX_PER_TICK = "5"

# How many events the LOG queue holds, 80 bytes each at the default text size. Every event goes into it, and
# the event log's writer takes them out, so it is where a burst or a stalled disk is absorbed. Default 1024,
# 1..=65535.
VEE_EV_LOG_QUEUE_DEPTH = "1024"

# The most events one module (or the core) can define. Default 256, 1..=65535.
VEE_EV_MAX_CODES = "256"

# The most bytes of file data in one file request or response. Every request is this size plus a little,
# so it sets how much memory the file service's queues take. A table must fit in it. Default 4096, 1..=65536.
VEE_FILE_DATA_MAX_BYTES = "4096"

# The most bytes in a file path. A longer path is refused, never cut. Default 128, 1..=1024.
VEE_FILE_PATH_MAX_BYTES = "128"
