[workspace]
resolver = "3"
members = ["core-api", "core-derive", "core-types", "core", "osal", "modules/example", "sample-deployment"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# External dependencies, with the version and features chosen once here. Crates use them as
# `name = { workspace = true }`. Keep this list short (see "General Requirements" in the design).
[workspace.dependencies]
# The logging facade for the system log. No default features: it works without std.
log = { version = "0.4", default-features = false }

# Every crate opts in with `[lints] workspace = true`.
# `unsafe_code` is `deny` here so the osal, the only crate that may use unsafe, can allow a
# specific block with `#[allow(unsafe_code, reason = "...")]`. Every flight crate also says
# `#![forbid(unsafe_code)]` at the top of its lib.rs, and `forbid` cannot be overridden.
[workspace.lints.rust]
unsafe_code = "deny"

# Panic paths: flight code handles the error instead (see CLAUDE.md). Tests may allow these.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Easy ones: no or few hits expected.
wildcard_imports = "deny"        # the no-glob import rule
enum_glob_use = "deny"
allow_attributes_without_reason = "deny"
string_slice = "deny"            # `&s[..n]` panics off a character boundary
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"

# Harder ones, added one at a time.
arithmetic_side_effects = "deny" # `a + b` panics in debug and wraps in release: say which you mean
cast_possible_truncation = "deny" # `x as u8` silently drops the high bits
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

# The flight build (`cargo build --release`). A panic aborts the process: no unwinding and no recovery,
# so a panic in any thread stops the whole process and the supervisor restarts it (see "Faults" in the
# design). The panic hook (`std_panic`) is installed only in a build like this one, by the executive's
# `main`, which asks `cfg!(panic = "abort")`. LTO and one codegen unit let the compiler see the whole
# program. Measured on the sample deployment: 579 KB without these, 468 KB with them (376 KB stripped);
# the optimization level (`s`, `z`) would save only 6% more, so it stays at the default. Symbols are kept,
# so an address in a report can be looked up. Tests always unwind, whatever this says.
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
